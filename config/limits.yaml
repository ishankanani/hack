# MathFix AI: per-user daily limits and the global capacity guard.
# Admins can change limits live with /setlimit (stored in the database, overrides this file).

reset_timezone: "UTC"        # ONE timezone for everyone: set your main audience's, e.g. "Asia/Kolkata"

# Daily allowance per plan. Everyone is on "free" for now; "premium" is ready for later and can
# be given to testers with /setplan <user_id> premium. /setlimit changes the free plan live.
plans:
  free: {solves: 5, tutor: 15}         # raise to 10 once capacity grows (OpenRouter $10 top-up or Plan C)
  premium: {solves: 50, tutor: 200}

# Invite friends: both sides get extra solves for that day when the friend solves their first problem
referral:
  inviter_bonus_solves: 3
  friend_bonus_solves: 2
  max_rewards_per_day: 5

burst:
  max_in_flight: 1           # one request at a time per user
  max_per_minute: 5

wrong_report_refunds_per_day: 3

capacity_guard:
  soft_at: 0.85              # solve pool 85 % used -> shrink limits for the rest of the day
  soft_limits: {solves: 3, tutor: 8}
  hard_at: 0.98              # pool 98 % used -> pause new solves (cache hits + tutor still work)
